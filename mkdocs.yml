site_name: Cloudspace Shared Platform
site_description: Production architecture, contracts, SDKs, deployment, and operations for Cloudspace Shared Platform
site_url: https://ariweinberg.github.io/Infraxis/
exclude_docs: |
  README.md
repo_url: https://github.com/ariWeinberg/Infraxis
repo_name: ariWeinberg/Infraxis
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  custom_dir: docs/overrides
plugins:
  - search
  - minify:
      minify_html: true
extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs
  - javascripts/mermaid-init.js
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true, line_spans: __span}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Contracts: contracts/guide.md
      - ADRs:
          - Service boundaries: adr/ADR-001-service-boundaries.md
          - Contract-first: adr/ADR-002-contract-first.md
          - Fail-closed authorization: adr/ADR-003-fail-closed-authorization.md
  - Security:
      - Authentication / OIDC: authentication/oidc.md
      - Authorization model: authorization/model.md
      - Security model: security/model.md
  - Platform domains:
      - Billing and Stripe: billing/model.md
      - SDK reference: sdk.md
  - Developer guide:
      - Local development: development/local.md
      - Testing strategy: testing/strategy.md
  - Operations:
      - Kubernetes and Argo CD: deployment/kubernetes.md
      - Argo dependency management: deployment/argocd.md
      - Operations runbook: operations/runbook.md
      - Failure behavior: operations/failure-modes.md
  - Project tracking:
      - Implementation checklist: project/checklist.md
