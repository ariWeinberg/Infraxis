[project]
name = "cloudspace-platform"
version = "0.1.0"
description = "Cloudspace-owned shared authentication, authorization, and billing contracts"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/platform-api"}
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "coverage>=7.6,<8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["apps/platform-api/tests"]
pythonpath = ["apps/platform-api", "sdk/python/src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
