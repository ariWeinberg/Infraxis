apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudspace-opa.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "cloudspace-opa.name" . }}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "cloudspace-opa.name" . }}}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: opa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["run", "--server", "--set=decision_logs.console=false", "/policy"]
          ports: [{name: http, containerPort: 8181}]
          volumeMounts: [{name: policy, mountPath: /policy, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /health, port: http}}
          readinessProbe: {httpGet: {path: /health?bundles, port: http}}
      volumes: [{name: policy, configMap: {name: {{ .Values.policyConfigMap }}}}]
