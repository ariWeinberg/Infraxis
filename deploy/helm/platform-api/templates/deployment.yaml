apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "platform-api.name" . }}, labels: {{- include "platform-api.labels" . | nindent 4 }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "platform-api.name" . }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "platform-api.name" . }}}}
    spec:
      serviceAccountName: {{ default (include "platform-api.name" .) .Values.serviceAccount.name }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: platform-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env: [{name: CLOUDSPACE_ENVIRONMENT, value: {{ .Values.config.environment | quote }}}, {name: CLOUDSPACE_OPA_URL, value: {{ .Values.config.opaUrl | quote }}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
