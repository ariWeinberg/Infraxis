{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "platform-api.name" . }} }
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ include "platform-api.name" . }}}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudspace-system}}}], ports: [{protocol: TCP, port: 8000}]}]
  egress: [{to: [{namespaceSelector: {}}]}]
{{- end }}
